name: Release desktop artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example 1.0.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows-unsigned:
    name: Windows x64 unsigned build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop-tauri/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies and verify web source
        shell: bash
        run: |
          npm ci --prefix web
          npm ci --prefix desktop-tauri
          npm --prefix web run lint
          npm --prefix web run build
      - name: Build unsigned application executable
        shell: bash
        run: npm --prefix desktop-tauri exec -- tauri build --no-bundle --target x86_64-pc-windows-msvc --no-sign
      - name: Prepare public executable artifact
        shell: pwsh
        run: Copy-Item desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/thatsoundslikeme-tauri.exe desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/ThatSoundsLikeMe.exe -Force
      - name: Upload unsigned executable
        uses: actions/upload-artifact@v4
        with:
          name: thatsoundslikeme-${{ inputs.version }}-windows-executable-unsigned
          path: desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/ThatSoundsLikeMe.exe
          if-no-files-found: error
      - name: Package NSIS installer
        shell: bash
        run: npm --prefix desktop-tauri exec -- tauri bundle --bundles nsis --target x86_64-pc-windows-msvc --no-sign
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: thatsoundslikeme-${{ inputs.version }}-windows-installer-unsigned
          path: desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ThatSoundsLikeMe-${{ inputs.version }}-windows-x64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          pushd desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          sha256sum *.exe > "$GITHUB_WORKSPACE/SHA256SUMS-windows.txt"
          popd
          sha256sum ThatSoundsLikeMe-${{ inputs.version }}-windows-x64.spdx.json >> SHA256SUMS-windows.txt
      - name: Upload final installer, checksum and SBOM
        uses: actions/upload-artifact@v4
        with:
          name: thatsoundslikeme-${{ inputs.version }}-windows-x64
          path: |
            desktop-tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            ThatSoundsLikeMe-${{ inputs.version }}-windows-x64.spdx.json
            SHA256SUMS-windows.txt
          if-no-files-found: error
