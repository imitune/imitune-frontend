<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff9e9"/>
      <stop offset="1" stop-color="#f2e4c5"/>
    </linearGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#223745" flood-opacity="0.22"/>
    </filter>
    <filter id="bird-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#223745" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="92" y="70" width="840" height="840" rx="188" fill="url(#background)" filter="url(#tile-shadow)"/>
  <rect x="93" y="71" width="838" height="838" rx="187" fill="none" stroke="#304450" stroke-opacity="0.12" stroke-width="2"/>
  <image href="bird.png" x="235" y="170" width="554" height="618" preserveAspectRatio="xMidYMid meet" filter="url(#bird-shadow)"/>
