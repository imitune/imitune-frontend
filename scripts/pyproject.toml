[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imitune-feedback-downloader"
version = "1.0.0"
description = "Download and consolidate feedback data from Vercel Blob Storage for ImiTune"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ImiTune Team"}
]
keywords = ["vercel", "blob", "feedback", "imitune"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.25.0",
    "tqdm>=4.60.0",
]

[project.scripts]
download-feedback = "download_feedback:main"

[project.urls]
Homepage = "https://thatsoundslike.me"
Repository = "https://github.com/chrispla/imitune-frontend"

[tool.hatch.build.targets.wheel]
packages = ["."]
