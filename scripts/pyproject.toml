[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thatsoundslikeme-feedback-downloader"
version = "1.2.0"
description = "Download, consolidate, and analyse ThatSoundsLikeMe feedback from Vercel Blob Storage"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "ThatSoundsLikeMe contributors"}
]
keywords = ["vercel", "blob", "feedback", "thatsoundslikeme"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.32.4",
    "tqdm>=4.67.1",
]

[project.scripts]
download-feedback = "download_feedback:main"
feedback-dashboard = "dashboard:main"

[project.urls]
Homepage = "https://thatsoundslike.me"
Repository = "https://github.com/thatsoundslikeme/app"

[tool.hatch.build.targets.wheel]
packages = ["."]
