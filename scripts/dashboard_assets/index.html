<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ThatSoundLikeMe — Feedback dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="static-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div>
      <p class="eyebrow">ThatSoundLikeMe</p>
      <h1>Feedback dashboard</h1>
      <p class="subtitle">Explore imitation queries, ratings, ranks, and index performance.</p>
    </div>
    <div class="header-actions">
      <span class="privacy-badge">Local only</span>
      <button id="reload-button" class="button secondary" type="button">Reload data</button>
    </div>
  </header>

  <main>
    <section class="filter-panel" aria-labelledby="filters-title">
      <div class="section-heading compact">
        <div>
          <p class="eyebrow">Scope</p>
          <h2 id="filters-title">Filters</h2>
        </div>
        <button id="reset-button" class="text-button" type="button">Reset filters</button>
      </div>
      <div class="filters">
        <label>Start date<input id="start-date" type="date"></label>
        <label>End date<input id="end-date" type="date"></label>
        <label>Mode<select id="mode-filter">
          <option value="all">All modes</option>
          <option value="normal">Normal / legacy</option>
          <option value="dev">Dev multi-index</option>
        </select></label>
        <label>Index<select id="index-filter"><option value="all">All indices</option></select></label>
        <label>Rating<select id="rating-filter">
          <option value="all">All results</option>
          <option value="rated">Rated only</option>
          <option value="like">Likes only</option>
          <option value="dislike">Dislikes only</option>
          <option value="unrated">Unrated only</option>
        </select></label>
        <label>Sort<select id="sort-filter">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
        </select></label>
      </div>
      <p id="filter-summary" class="filter-summary" aria-live="polite"></p>
    </section>

    <section aria-labelledby="summary-title">
      <div class="section-heading">
        <div><p class="eyebrow">At a glance</p><h2 id="summary-title">Summary</h2></div>
        <p id="data-updated" class="muted"></p>
      </div>
      <div id="summary-cards" class="summary-grid"></div>
    </section>

    <div class="analysis-grid">
      <section aria-labelledby="index-chart-title">
        <div class="section-heading">
          <div><p class="eyebrow">Comparison</p><h2 id="index-chart-title">Ratings by index</h2></div>
        </div>
        <div id="index-chart" class="bar-chart" role="img" aria-label="Likes and dislikes by index"></div>
      </section>

      <section aria-labelledby="rank-chart-title">
        <div class="section-heading">
          <div><p class="eyebrow">Retrieval quality</p><h2 id="rank-chart-title">Performance by rank</h2></div>
        </div>
        <div id="rank-chart" class="bar-chart" role="img" aria-label="Like rate by result rank"></div>
      </section>
    </div>

    <section aria-labelledby="timeline-title">
      <div class="section-heading">
        <div><p class="eyebrow">Activity</p><h2 id="timeline-title">Queries over time</h2></div>
      </div>
      <div id="timeline-chart" class="timeline-chart" role="img" aria-label="Number of feedback queries by date"></div>
    </section>

    <section aria-labelledby="explorer-title">
      <div class="section-heading explorer-heading">
        <div>
          <p class="eyebrow">Listen and inspect</p>
          <h2 id="explorer-title">Query explorer</h2>
        </div>
        <button id="export-button" class="button secondary" type="button">Export filtered CSV</button>
      </div>
      <div id="query-list" class="query-list"></div>
      <div class="load-more-wrap"><button id="load-more-button" class="button" type="button">Show more</button></div>
    </section>

    <div id="error-panel" class="error-panel" hidden role="alert"></div>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
