[package]
name = "thatsoundlikeme-tauri"
version = "1.0.0"
description = "Search Freesound by imitating a sound with your voice."
authors = ["Imitune"]
edition = "2024"
rust-version = "1.88"

[lib]
name = "thatsoundlikeme_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
open = "5.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.3"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
